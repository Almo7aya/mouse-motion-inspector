name: Manual build and packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Browser checks
        run: node --test --test-isolation=none tests/*.test.cjs
      - name: Native checks and build
        shell: pwsh
        run: ./build-native.ps1
      - name: Render chart examples
        shell: pwsh
        run: dotnet artifacts/MouseMotionInspector/MouseMotionInspector.dll --render-demo artifacts/chart-preview
      - name: Render visual guide
        shell: pwsh
        run: dotnet artifacts/MouseMotionInspector/MouseMotionInspector.dll --render-guide artifacts/guide-preview
      - name: Package self-contained Windows app
        shell: pwsh
        run: ./scripts/package.ps1 -SelfContained
      - name: Package framework-dependent app
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Package source
        shell: pwsh
        run: ./scripts/package-source.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MouseMotionInspector-win-x64
          path: artifacts/releases/*
          if-no-files-found: error
