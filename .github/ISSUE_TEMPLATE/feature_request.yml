name: Feature request
description: Suggest an improvement to mouse testing, graphs or usability.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and what makes it difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: Explain the expected behavior and any alternatives you considered.
    validations:
      required: true
